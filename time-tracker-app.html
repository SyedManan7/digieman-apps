<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TimeLedger — Freelance Time Tracker</title>
<meta name="description" content="TimeLedger: a private, offline freelance time tracker. Live timer, clients & projects, timesheets, invoices and CSV export.">
<style>
:root{
  --bg:#070b16; --bg2:#0b1120; --card:#101828; --card2:#0d1424;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.22);
  --text:#e8eefb; --muted:#8b98b8; --faint:#5b6a8f;
  --teal:#2dd4bf; --violet:#a78bfa; --gold:#fbbf24; --red:#f87171; --green:#34d399; --blue:#60a5fa;
  --grad:linear-gradient(135deg,#2dd4bf,#818cf8);
  --radius:16px; --shadow:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 500px at 12% -8%,rgba(45,212,191,.10),transparent 60%),
             radial-gradient(800px 520px at 95% 10%,rgba(129,140,248,.12),transparent 60%),
             radial-gradient(700px 600px at 50% 110%,rgba(52,211,153,.06),transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:#0a1020;
  border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
input[type="checkbox"]{width:auto;accent-color:var(--teal)}
label.lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
aside#side{width:264px;flex:0 0 264px;background:rgba(10,15,30,.82);backdrop-filter:blur(14px);
  border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;z-index:60;display:flex;flex-direction:column}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:800;color:#06121a;box-shadow:0 6px 18px rgba(45,212,191,.35)}
.brand b{font-size:18px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
nav#nav{padding:6px 12px;display:flex;flex-direction:column;gap:4px}
nav#nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--muted);
  text-decoration:none;font-weight:600;font-size:14.5px;transition:.15s}
nav#nav a .ic{width:30px;height:30px;border-radius:9px;background:rgba(148,163,184,.10);display:flex;align-items:center;justify-content:center;font-size:15px}
nav#nav a:hover{color:var(--text);background:rgba(148,163,184,.07)}
nav#nav a.on{color:var(--text);background:linear-gradient(135deg,rgba(45,212,191,.16),rgba(129,140,248,.16));border:1px solid var(--line)}
nav#nav a.on .ic{background:var(--grad);color:#06121a}
#sideTimer{margin:auto 14px 16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);display:none}
#sideTimer.show{display:block}
#sideTimer .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
#sideTimer .p{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sideTimer .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
/* ---------- main ---------- */
main{flex:1;margin-left:264px;padding:30px 30px 90px;max-width:1180px;width:100%}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.viewhead h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.viewhead p{color:var(--muted);font-size:13.5px;margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 45%),var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,var(--teal));opacity:.9}
.stat .k{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:27px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
  padding:11px 18px;font-size:14px;font-weight:700;color:#06121a;background:var(--grad);transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:rgba(148,163,184,.10);color:var(--text);border:1px solid var(--line2)}
.btn.warn{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
.btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* timer hero */
.timerhero{text-align:center;padding:30px 20px 26px}
.timerdisplay{font-size:64px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 4px}
.timerdisplay.paused{color:var(--gold);-webkit-text-fill-color:var(--gold);background:none}
.timerstate{font-size:13px;color:var(--muted);font-weight:600}
.timerstate .live{color:var(--green)} .timerstate .pau{color:var(--gold)}
/* tables & lists */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line2)}
table.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.rowitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.dotc{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(148,163,184,.12);color:var(--muted)}
.chip.bil{background:rgba(52,211,153,.14);color:#6ee7b7}
.chip.non{background:rgba(251,191,36,.13);color:#fcd34d}
.muted{color:var(--muted)} .small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px}
canvas.chart{width:100%;height:220px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* forms inline */
.frow{display:grid;gap:12px;margin-bottom:12px}
.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--teal)}
details.dbox{border:1px solid var(--line);border-radius:12px;padding:4px 14px;background:var(--card2)}
details.dbox summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:14px;list-style:none}
details.dbox summary::-webkit-details-marker{display:none}
details.dbox summary::before{content:"+";margin-right:8px;color:var(--teal);font-weight:800}
details.dbox[open] summary::before{content:"–"}
.clientcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card2);margin-bottom:14px}
.clientcard .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.clientcard .chead b{font-size:16px}
.proj{border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.proj .nm{font-weight:600;font-size:14px}
/* invoice */
.inv{background:#fff;color:#0f172a;border-radius:14px;padding:34px;max-width:760px;margin:0 auto}
.inv h2{color:#0f172a}.inv .tbl th{color:#64748b;border-color:#e2e8f0}.inv .tbl td{border-color:#f1f5f9;color:#0f172a}
.invhead{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.invtotal{background:#f8fafc;border-radius:10px;padding:14px 18px;text-align:right;font-size:16px}
/* tabbar mobile */
#tabbar{display:none}
#topbar{display:none}
.empty{text-align:center;color:var(--faint);padding:34px 10px;font-size:14px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#0d1526;border:1px solid var(--teal);
  color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){
  aside#side{display:none}
  main{margin-left:0;padding:18px 14px 110px}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .timerdisplay{font-size:52px}
  #topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:55;
    background:rgba(7,11,22,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  #topbar .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06121a}
  #topbar b{font-size:16px}
  #tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,15,30,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  #tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px}
  #tabbar a .ic{display:block;font-size:19px;margin-bottom:2px}
  #tabbar a.on{color:var(--teal)}
  .f3{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.f2{grid-template-columns:1fr}}
@media print{
  body::before,aside#side,#topbar,#tabbar,.noprint{display:none!important}
  main{margin:0;padding:0;max-width:none}
  body{background:#fff}
  .inv{box-shadow:none;border:1px solid #e2e8f0}
  #view .card,#view .viewhead{display:none}
  #view #printArea{display:block!important}
}
</style>
</head>
<body>
<div id="topbar"><div class="logo">◷</div><b>TimeLedger</b><span class="muted small" style="margin-left:auto" id="topClock"></span></div>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo">◷</div><div><b>TimeLedger</b><small>Freelance time tracker</small></div></div>
    <nav id="nav"></nav>
    <div id="sideTimer"><span class="dot"></span><span class="small muted" id="sideTimerName">Timer</span><div class="t num" id="sideTimerVal">00:00:00</div><div class="p" id="sideTimerProj"></div></div>
  </aside>
  <main><div id="view"></div></main>
  <nav id="tabbar"></nav>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   TimeLedger — data model (DOM-free). Works in browser and in node tests.
   Usage: const TL = createTimeLedger(storage)  // storage: localStorage-like
   ===================================================================== */
function createTimeLedger(storage) {
  const KEY = 'timeledger.v1';
  let S = null;

  function blank() {
    return { clients: [], projects: [], entries: [], timer: null,
             settings: { currency: 'USD', weekStart: 1, businessName: '' }, seq: 1 };
  }
  function normalize() {
    S.clients = S.clients || []; S.projects = S.projects || []; S.entries = S.entries || [];
    S.timer = S.timer || null;
    S.settings = Object.assign({ currency: 'USD', weekStart: 1, businessName: '' }, S.settings || {});
    S.seq = S.seq || 1;
  }
  function save() { storage.setItem(KEY, JSON.stringify(S)); }
  function load() {
    try { const raw = storage.getItem(KEY); S = raw ? JSON.parse(raw) : blank(); }
    catch (e) { S = blank(); }
    normalize(); return S;
  }
  function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + '_' + (S.seq++); }

  /* ---------------- date helpers (local time) ---------------- */
  function dstr(d) { // 'YYYY-MM-DD' local
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
  }
  function parseD(str) { const a = str.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function dayRange(dateStr) {
    const d = parseD(dateStr); d.setHours(0, 0, 0, 0);
    return [d.getTime(), d.getTime() + 86400000];
  }
  function weekRange(dateStr) {
    const ws = S.settings.weekStart; // 0 Sun .. 6 Sat
    const d = parseD(dateStr); d.setHours(0, 0, 0, 0);
    const dow = d.getDay();
    const diff = (dow - ws + 7) % 7;
    const start = d.getTime() - diff * 86400000;
    return [start, start + 7 * 86400000];
  }
  function monthRange(y, m) { // m 0-based
    const s = new Date(y, m, 1); s.setHours(0, 0, 0, 0);
    const e = new Date(y, m + 1, 1); e.setHours(0, 0, 0, 0);
    return [s.getTime(), e.getTime()];
  }

  /* ---------------- lookups ---------------- */
  function getClient(id) { return S.clients.find(c => c.id === id) || null; }
  function getProject(id) { return S.projects.find(p => p.id === id) || null; }
  function clientRate(c) { return (c && c.hourlyRate != null) ? Number(c.hourlyRate) : 0; }
  function projectRate(p) {
    if (!p) return 0;
    if (p.hourlyRate != null && p.hourlyRate !== '') return Number(p.hourlyRate);
    return clientRate(getClient(p.clientId));
  }
  function activeClients() { return S.clients.filter(c => !c.archived); }
  function activeProjects() {
    return S.projects.filter(p => !p.archived && getClient(p.clientId) && !getClient(p.clientId).archived);
  }

  /* ---------------- clients / projects ---------------- */
  function addClient(o) {
    o = o || {};
    const name = String(o.name || '').trim();
    if (!name) return { error: 'Client name is required.' };
    const c = { id: uid('c'), name: name, color: o.color || pickColor(S.clients.length),
                hourlyRate: o.hourlyRate === '' || o.hourlyRate == null ? 0 : Number(o.hourlyRate),
                notes: String(o.notes || ''), archived: false, createdAt: new Date().toISOString() };
    S.clients.push(c); save(); return { client: c };
  }
  function updateClient(id, patch) {
    const c = getClient(id); if (!c) return { error: 'Client not found.' };
    if (patch.name != null) { const n = String(patch.name).trim(); if (!n) return { error: 'Name required.' }; c.name = n; }
    if (patch.color != null) c.color = patch.color;
    if (patch.hourlyRate != null) c.hourlyRate = patch.hourlyRate === '' ? 0 : Number(patch.hourlyRate);
    if (patch.notes != null) c.notes = String(patch.notes);
    if (patch.archived != null) c.archived = !!patch.archived;
    save(); return { client: c };
  }
  function deleteClient(id) {
    const i = S.clients.findIndex(c => c.id === id); if (i < 0) return { error: 'Client not found.' };
    if (S.projects.some(p => p.clientId === id)) return { error: 'Client still has projects. Archive it instead.' };
    S.clients.splice(i, 1); save(); return { ok: true };
  }
  function addProject(o) {
    o = o || {};
    const c = getClient(o.clientId); if (!c) return { error: 'Pick a client first.' };
    const name = String(o.name || '').trim();
    if (!name) return { error: 'Project name is required.' };
    const p = { id: uid('p'), clientId: o.clientId, name: name,
                hourlyRate: (o.hourlyRate === '' || o.hourlyRate == null) ? null : Number(o.hourlyRate),
                billable: o.billable === false ? false : true,
                archived: false, createdAt: new Date().toISOString() };
    S.projects.push(p); save(); return { project: p };
  }
  function updateProject(id, patch) {
    const p = getProject(id); if (!p) return { error: 'Project not found.' };
    if (patch.name != null) { const n = String(patch.name).trim(); if (!n) return { error: 'Name required.' }; p.name = n; }
    if (patch.clientId != null) { if (!getClient(patch.clientId)) return { error: 'Client not found.' }; p.clientId = patch.clientId; }
    if (patch.hourlyRate !== undefined) p.hourlyRate = (patch.hourlyRate === '' || patch.hourlyRate == null) ? null : Number(patch.hourlyRate);
    if (patch.billable != null) p.billable = !!patch.billable;
    if (patch.archived != null) p.archived = !!patch.archived;
    save(); return { project: p };
  }
  function deleteProject(id) {
    const i = S.projects.findIndex(p => p.id === id); if (i < 0) return { error: 'Project not found.' };
    if (S.entries.some(e => e.projectId === id)) return { error: 'Project has time entries. Archive it instead.' };
    S.projects.splice(i, 1); save(); return { ok: true };
  }

  /* ---------------- timer ---------------- */
  function timerElapsed(t, nowMs) {
    if (!t) return 0;
    const now = nowMs != null ? nowMs : Date.now();
    let s = t.accumSec || 0;
    if (!t.paused && t.runningSinceISO) s += Math.max(0, (now - Date.parse(t.runningSinceISO)) / 1000);
    return s;
  }
  function startTimer(projectId, nowMs) {
    if (S.timer) return { error: 'A timer is already running. Stop it first.' };
    const p = getProject(projectId); if (!p) return { error: 'Pick a project first.' };
    const now = nowMs != null ? nowMs : Date.now();
    S.timer = { projectId: projectId, clientId: p.clientId, runningSinceISO: new Date(now).toISOString(),
                accumSec: 0, paused: false, note: '' };
    save(); return { timer: S.timer };
  }
  function pauseTimer(nowMs) {
    if (!S.timer) return { error: 'No timer running.' };
    if (S.timer.paused) return { error: 'Timer is already paused.' };
    S.timer.accumSec = Math.round(timerElapsed(S.timer, nowMs));
    S.timer.paused = true; S.timer.runningSinceISO = null;
    save(); return { timer: S.timer };
  }
  function resumeTimer(nowMs) {
    if (!S.timer) return { error: 'No timer running.' };
    if (!S.timer.paused) return { error: 'Timer is not paused.' };
    const now = nowMs != null ? nowMs : Date.now();
    S.timer.paused = false; S.timer.runningSinceISO = new Date(now).toISOString();
    save(); return { timer: S.timer };
  }
  function setTimerNote(note) { if (S.timer) { S.timer.note = String(note || ''); save(); } }
  function stopTimer(note, nowMs) {
    if (!S.timer) return { error: 'No timer running.' };
    const now = nowMs != null ? nowMs : Date.now();
    const t = S.timer;
    const secs = Math.max(0, Math.round(timerElapsed(t, now)));
    const p = getProject(t.projectId);
    const e = { id: uid('e'), projectId: t.projectId, clientId: t.clientId,
                startISO: t.paused && t.firstStartISO ? t.firstStartISO : isoOfFirstStart(t),
                endISO: new Date(now).toISOString(),
                seconds: secs, note: String(note != null ? note : (t.note || '')),
                billable: p ? p.billable : true, manual: false,
                rateSnapshot: p ? projectRate(p) : 0 };
    // startISO: reconstruct from end - elapsed
    e.startISO = new Date(now - secs * 1000).toISOString();
    S.entries.push(e); S.timer = null; save(); return { entry: e };
  }
  function isoOfFirstStart(t) { return t.runningSinceISO || new Date().toISOString(); }

  /* ---------------- manual entries ---------------- */
  function addManualEntry(o) {
    o = o || {};
    const p = getProject(o.projectId); if (!p) return { error: 'Pick a project first.' };
    if (!o.dateStr) return { error: 'Pick a date.' };
    let seconds = 0, startISO = null, endISO = null;
    if (o.hoursDecimal != null && o.hoursDecimal !== '') {
      const h = Number(o.hoursDecimal);
      if (!(h > 0)) return { error: 'Hours must be greater than 0.' };
      seconds = Math.round(h * 3600);
      const d = parseD(o.dateStr); d.setHours(9, 0, 0, 0);
      startISO = d.toISOString(); endISO = new Date(d.getTime() + seconds * 1000).toISOString();
    } else {
      if (!o.startHM || !o.endHM) return { error: 'Enter start and end time, or decimal hours.' };
      const d = parseD(o.dateStr);
      const s = new Date(d); const sp = o.startHM.split(':'); s.setHours(+sp[0], +sp[1], 0, 0);
      const e2 = new Date(d); const ep = o.endHM.split(':'); e2.setHours(+ep[0], +ep[1], 0, 0);
      if (e2.getTime() <= s.getTime()) return { error: 'End time must be after start time.' };
      seconds = Math.round((e2.getTime() - s.getTime()) / 1000);
      startISO = s.toISOString(); endISO = e2.toISOString();
    }
    const e = { id: uid('e'), projectId: p.id, clientId: p.clientId, startISO: startISO, endISO: endISO,
                seconds: seconds, note: String(o.note || ''),
                billable: o.billable === false ? false : p.billable, manual: true,
                rateSnapshot: projectRate(p) };
    S.entries.push(e); save(); return { entry: e };
  }
  function updateEntry(id, patch) {
    const e = S.entries.find(x => x.id === id); if (!e) return { error: 'Entry not found.' };
    if (patch.note != null) e.note = String(patch.note);
    if (patch.billable != null) e.billable = !!patch.billable;
    if (patch.seconds != null) { const s = Math.round(Number(patch.seconds)); if (!(s >= 0)) return { error: 'Bad duration.' }; e.seconds = s; }
    if (patch.projectId != null) {
      const p = getProject(patch.projectId); if (!p) return { error: 'Project not found.' };
      e.projectId = p.id; e.clientId = p.clientId; e.billable = p.billable; e.rateSnapshot = projectRate(p);
    }
    save(); return { entry: e };
  }
  function deleteEntry(id) {
    const i = S.entries.findIndex(x => x.id === id); if (i < 0) return { error: 'Entry not found.' };
    S.entries.splice(i, 1); save(); return { ok: true };
  }

  /* ---------------- aggregation ---------------- */
  function entriesBetween(fromMs, toMs) {
    return S.entries
      .filter(e => { const t = Date.parse(e.startISO); return t >= fromMs && t < toMs; })
      .sort((a, b) => Date.parse(a.startISO) - Date.parse(b.startISO));
  }
  function amountOf(e) {
    const rate = (e.rateSnapshot != null) ? Number(e.rateSnapshot) : projectRate(getProject(e.projectId));
    return (e.seconds / 3600) * rate;
  }
  function summarize(entries) {
    const out = { totalSec: 0, billableSec: 0, nonBillableSec: 0, amount: 0, billableAmount: 0,
                  byClient: {}, byProject: {} };
    entries.forEach(e => {
      out.totalSec += e.seconds;
      const amt = amountOf(e);
      if (e.billable) { out.billableSec += e.seconds; out.billableAmount += amt; }
      else out.nonBillableSec += e.seconds;
      out.amount += amt;
      const c = getClient(e.clientId); const p = getProject(e.projectId);
      const ck = e.clientId, pk = e.projectId;
      if (!out.byClient[ck]) out.byClient[ck] = { id: ck, name: c ? c.name : '(deleted)', color: c ? c.color : '#64748b', sec: 0, amount: 0 };
      out.byClient[ck].sec += e.seconds; out.byClient[ck].amount += amt;
      if (!out.byProject[pk]) out.byProject[pk] = { id: pk, name: p ? p.name : '(deleted)', clientId: e.clientId, sec: 0, amount: 0 };
      out.byProject[pk].sec += e.seconds; out.byProject[pk].amount += amt;
    });
    return out;
  }

  /* ---------------- CSV ---------------- */
  function csvCell(v) {
    v = String(v == null ? '' : v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function csvExport(entries) {
    const rows = [['Date', 'Client', 'Project', 'Start', 'End', 'Hours', 'Billable', 'Rate', 'Amount', 'Note']];
    entries.forEach(e => {
      const c = getClient(e.clientId), p = getProject(e.projectId);
      const st = new Date(e.startISO), en = new Date(e.endISO);
      rows.push([dstr(st), c ? c.name : '', p ? p.name : '',
        st.toTimeString().slice(0, 5), en.toTimeString().slice(0, 5),
        (e.seconds / 3600).toFixed(2), e.billable ? 'yes' : 'no',
        Number(e.rateSnapshot != null ? e.rateSnapshot : 0).toFixed(2),
        amountOf(e).toFixed(2), e.note || '']);
    });
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  }

  /* ---------------- invoice summary ---------------- */
  function invoiceFor(clientId, fromISODate, toISODate) {
    const c = getClient(clientId); if (!c) return { error: 'Client not found.' };
    const a = parseD(fromISODate); a.setHours(0, 0, 0, 0);
    const b = parseD(toISODate); b.setHours(0, 0, 0, 0); b.setTime(b.getTime() + 86400000);
    const entries = entriesBetween(a.getTime(), b.getTime()).filter(e => e.clientId === clientId && e.billable);
    const lines = entries.map(e => {
      const p = getProject(e.projectId);
      const rate = Number(e.rateSnapshot != null ? e.rateSnapshot : projectRate(p));
      return { date: dstr(new Date(e.startISO)), project: p ? p.name : '(deleted)', note: e.note || '',
               hours: e.seconds / 3600, rate: rate, amount: (e.seconds / 3600) * rate };
    });
    const byProject = {};
    lines.forEach(l => {
      if (!byProject[l.project]) byProject[l.project] = { project: l.project, hours: 0, amount: 0 };
      byProject[l.project].hours += l.hours; byProject[l.project].amount += l.amount;
    });
    const totalHours = lines.reduce((s, l) => s + l.hours, 0);
    const totalAmount = lines.reduce((s, l) => s + l.amount, 0);
    return { client: c, from: fromISODate, to: toISODate, lines: lines, byProject: byProject,
             totalHours: totalHours, totalAmount: totalAmount, count: lines.length };
  }

  /* ---------------- format ---------------- */
  const CUR = { USD: '$', EUR: '€', GBP: '£', PKR: '₨', INR: '₹', AED: 'د.إ', SAR: '﷼', CAD: 'CA$', AUD: 'A$', CHF: 'CHF ', JPY: '¥', CNY: '¥' };
  function curSym() { return CUR[S.settings.currency] || (S.settings.currency + ' '); }
  function fmtMoney(n) {
    const v = (Math.round(Number(n) * 100) / 100).toFixed(2);
    return curSym() + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDur(sec) {
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h === 0 && m === 0) return sec + 's';
    if (h === 0) return m + 'm';
    return h + 'h ' + m + 'm';
  }
  function fmtHMS(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = String(Math.floor(sec / 3600)).padStart(2, '0');
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return h + ':' + m + ':' + s;
  }
  function fmtHours(sec) { return (sec / 3600).toFixed(2) + 'h'; }

  /* ---------------- backup / misc ---------------- */
  function exportJSON() { return JSON.stringify(S, null, 2); }
  function importJSON(text) {
    let obj; try { obj = JSON.parse(text); } catch (e) { return { error: 'Not valid JSON.' }; }
    if (!obj || !Array.isArray(obj.entries) || !Array.isArray(obj.clients)) return { error: 'Not a TimeLedger backup.' };
    S = obj; normalize(); save(); return { ok: true };
  }
  function clearAll() { S = blank(); save(); }
  function updateSettings(patch) { Object.assign(S.settings, patch || {}); save(); }

  const PALETTE = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#a855f7', '#ec4899', '#14b8a6'];
  function pickColor(i) { return PALETTE[i % PALETTE.length]; }

  /* ---------------- demo seed ---------------- */
  function seedDemo(nowMs) {
    const now = nowMs != null ? nowMs : Date.now();
    clearAll();
    const c1 = addClient({ name: 'Acme Corp', color: '#6366f1', hourlyRate: 85 }).client;
    const c2 = addClient({ name: 'Brightside Studio', color: '#10b981', hourlyRate: 65 }).client;
    const c3 = addClient({ name: 'Personal', color: '#f59e0b', hourlyRate: 0 }).client;
    const p1 = addProject({ clientId: c1.id, name: 'Website Redesign', hourlyRate: null, billable: true }).project;
    const p2 = addProject({ clientId: c1.id, name: 'API Integration', hourlyRate: 95, billable: true }).project;
    const p3 = addProject({ clientId: c2.id, name: 'Brand Identity', hourlyRate: null, billable: true }).project;
    const p4 = addProject({ clientId: c3.id, name: 'Learning', hourlyRate: null, billable: false }).project;
    const notes = ['Homepage layout', 'Client feedback round', 'Bug fixes', 'Logo concepts', 'Style guide', 'Course videos', 'API auth flow', 'Landing copy'];
    const projs = [p1, p2, p3, p1, p2, p3, p4];
    let k = 0;
    for (let d = 9; d >= 0; d--) {
      const day = new Date(now - d * 86400000); day.setHours(0, 0, 0, 0);
      if (day.getDay() === 0 || day.getDay() === 6) continue; // weekdays only
      const n = 1 + (d % 3);
      for (let j = 0; j < n; j++) {
        const p = projs[k % projs.length]; k++;
        const st = new Date(day); st.setHours(9 + j * 3, (k * 17) % 60, 0, 0);
        const durH = 1 + ((k * 37) % 5) * 0.5;
        const en = new Date(st.getTime() + durH * 3600 * 1000);
        const e = { id: uid('e'), projectId: p.id, clientId: p.clientId,
                    startISO: st.toISOString(), endISO: en.toISOString(),
                    seconds: Math.round(durH * 3600), note: notes[k % notes.length],
                    billable: p.billable, manual: j % 2 === 0, rateSnapshot: projectRate(p) };
        S.entries.push(e);
      }
    }
    // a running timer on p1 started 24 minutes ago
    const t0 = now - 24 * 60 * 1000;
    S.timer = { projectId: p1.id, clientId: p1.clientId, runningSinceISO: new Date(t0).toISOString(),
                accumSec: 0, paused: false, note: 'Checkout flow' };
    S.settings.businessName = 'Alex Morgan — Freelance Developer';
    S.settings.currency = 'USD';
    save();
  }

  load();
  return {
    state: () => S, save: save, load: load,
    dstr: dstr, parseD: parseD, dayRange: dayRange, weekRange: weekRange, monthRange: monthRange,
    getClient: getClient, getProject: getProject, projectRate: projectRate, clientRate: clientRate,
    activeClients: activeClients, activeProjects: activeProjects,
    addClient: addClient, updateClient: updateClient, deleteClient: deleteClient,
    addProject: addProject, updateProject: updateProject, deleteProject: deleteProject,
    startTimer: startTimer, pauseTimer: pauseTimer, resumeTimer: resumeTimer, stopTimer: stopTimer,
    setTimerNote: setTimerNote, timerElapsed: timerElapsed,
    addManualEntry: addManualEntry, updateEntry: updateEntry, deleteEntry: deleteEntry,
    entriesBetween: entriesBetween, summarize: summarize, amountOf: amountOf,
    csvExport: csvExport, invoiceFor: invoiceFor,
    fmtMoney: fmtMoney, fmtDur: fmtDur, fmtHMS: fmtHMS, fmtHours: fmtHours, curSym: curSym,
    exportJSON: exportJSON, importJSON: importJSON, clearAll: clearAll, updateSettings: updateSettings,
    seedDemo: seedDemo
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = { createTimeLedger: createTimeLedger };

</script>
<script>
'use strict';
/* ============================== UI ============================== */
const TL = createTimeLedger(window.localStorage);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV = [
  { k: 'timer',     label: 'Timer',     ic: '⏱' },
  { k: 'dashboard', label: 'Dashboard', ic: '📊' },
  { k: 'timesheet', label: 'Timesheet', ic: '🗓' },
  { k: 'clients',   label: 'Clients',   ic: '👥' },
  { k: 'invoices',  label: 'Invoices',  ic: '🧾' },
  { k: 'export',    label: 'Export',    ic: '⬇' },
];
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function route() { const h = location.hash.replace('#/', ''); return NAV.some(n => n.k === h) ? h : 'timer'; }
function navTo(k) { location.hash = '#/' + k; }

function renderNav() {
  const r = route();
  $('#nav').innerHTML = NAV.map(n => `<a href="#/${n.k}" class="${r === n.k ? 'on' : ''}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
  $('#tabbar').innerHTML = NAV.map(n => `<a href="#/${n.k}" class="${r === n.k ? 'on' : ''}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
}
function projectOptions(selId) {
  const groups = {};
  TL.activeProjects().forEach(p => { (groups[p.clientId] = groups[p.clientId] || []).push(p); });
  let html = '<option value="">— Select project —</option>';
  Object.keys(groups).forEach(cid => {
    const c = TL.getClient(cid);
    html += `<optgroup label="${esc(c ? c.name : '')}">` + groups[cid].map(p =>
      `<option value="${p.id}" ${p.id === selId ? 'selected' : ''}>${esc(p.name)}${p.billable ? '' : ' (non-billable)'}</option>`).join('') + '</optgroup>';
  });
  return html;
}
function clientDot(cid) { const c = TL.getClient(cid); return `<span class="dotc" style="background:${c ? esc(c.color) : '#64748b'}"></span>`; }
function projName(pid) { const p = TL.getProject(pid); return p ? p.name : '(deleted project)'; }
function clientName(cid) { const c = TL.getClient(cid); return c ? c.name : '(deleted client)'; }
/* ---------------- TIMER VIEW ---------------- */
function vTimer() {
  const t = TL.state().timer;
  const today = TL.dstr(new Date());
  const [a, b] = TL.dayRange(today);
  const entries = TL.entriesBetween(a, b).slice().reverse();
  const sum = TL.summarize(TL.entriesBetween(a, b));
  const projs = TL.activeProjects();

  let hero;
  if (!t) {
    hero = `<div class="card timerhero">
      <h3 style="justify-content:center">⏱ Live timer</h3>
      <div class="timerdisplay">00:00:00</div>
      <div class="timerstate">No timer running — pick a project and hit start.</div>
      <div class="frow f2" style="max-width:560px;margin:18px auto 0;text-align:left">
        <div><label class="lbl">Project</label><select id="tProj">${projectOptions('')}</select></div>
        <div><label class="lbl">Note (optional)</label><input id="tNote" placeholder="What are you working on?"></div>
      </div>
      <div class="btnrow" style="justify-content:center"><button class="btn" id="btnStart" ${projs.length ? '' : 'disabled'}>▶ Start timer</button></div>
      ${projs.length ? '' : '<p class="muted small" style="margin-top:10px">Add a client & project first (Clients tab).</p>'}
    </div>`;
  } else {
    const p = TL.getProject(t.projectId);
    hero = `<div class="card timerhero">
      <h3 style="justify-content:center">⏱ Live timer</h3>
      <div class="timerdisplay ${t.paused ? 'paused' : ''}" id="bigTimer">00:00:00</div>
      <div class="timerstate">${t.paused ? '<span class="pau">⏸ PAUSED</span>' : '<span class="live">● RECORDING</span>'} — ${esc(clientName(t.clientId))} · ${esc(projName(t.projectId))}</div>
      <div style="max-width:560px;margin:18px auto 0;text-align:left"><label class="lbl">Note</label>
        <input id="tNoteLive" value="${esc(t.note || '')}" placeholder="What are you working on?"></div>
      <div class="btnrow" style="justify-content:center">
        ${t.paused
          ? `<button class="btn" id="btnResume">▶ Resume</button>`
          : `<button class="btn ghost" id="btnPause">⏸ Pause</button>`}
        <button class="btn" id="btnStop" style="background:linear-gradient(135deg,#34d399,#2dd4bf)">⏹ Stop & save</button>
      </div>
      <p class="muted small" style="margin-top:10px">Timer keeps running if you close the tab — it's saved on this device.</p>
    </div>`;
  }

  const rows = entries.map(e => `<div class="rowitem">
      ${clientDot(e.clientId)}
      <div style="flex:1;min-width:0"><b>${esc(projName(e.projectId))}</b>
        <div class="muted small">${fmtTime(e.startISO)}–${fmtTime(e.endISO)} · ${esc(e.note || '—')}</div></div>
      <span class="chip ${e.billable ? 'bil' : 'non'}">${e.billable ? 'billable' : 'non-bill.'}</span>
      <b class="num">${TL.fmtDur(e.seconds)}</b>
      <span class="muted small num">${TL.fmtMoney(TL.amountOf(e))}</span>
      <button class="btn ghost small" data-del="${e.id}">✕</button>
    </div>`).join('');

  return `<div class="viewhead"><div><h1>Timer</h1><p>Track time as it happens, or log it manually after the fact.</p></div>
    <div class="muted small">Today: <b class="num">${TL.fmtDur(sum.totalSec)}</b> · <b class="num">${TL.fmtMoney(sum.amount)}</b></div></div>
  <div class="grid g2">
    <div>${hero}
      <div class="card" style="margin-top:16px"><details class="dbox"><summary>＋ Add manual entry</summary>
        <div style="padding:8px 0 12px">
          <div class="frow f2"><div><label class="lbl">Project</label><select id="mProj">${projectOptions('')}</select></div>
          <div><label class="lbl">Date</label><input type="date" id="mDate" value="${today}"></div></div>
          <div class="frow f3"><div><label class="lbl">Start</label><input type="time" id="mStart" value="09:00"></div>
          <div><label class="lbl">End</label><input type="time" id="mEnd" value="10:00"></div>
          <div><label class="lbl">…or hours</label><input type="number" id="mHours" min="0" step="0.25" placeholder="1.5"></div></div>
          <div class="frow"><div><label class="lbl">Note</label><input id="mNote" placeholder="Optional note"></div></div>
          <button class="btn block" id="btnManual">Add entry</button>
        </div></details></div>
    </div>
    <div class="card"><h3>📝 Today's log <span class="tag chip">${entries.length}</span></h3>
      ${rows || '<div class="empty">Nothing logged today yet.<br>Start the timer or add a manual entry.</div>'}</div>
  </div>`;
}
function fmtTime(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function bindTimer() {
  const t = TL.state().timer;
  const start = $('#btnStart');
  if (start) start.onclick = () => {
    const pid = $('#tProj').value;
    if (!pid) { toast('Pick a project first.'); return; }
    const r = TL.startTimer(pid);
    if (r.error) toast(r.error); else { TL.setTimerNote($('#tNote').value); render(); toast('Timer started — go go go.'); }
  };
  const rs = $('#btnResume'); if (rs) rs.onclick = () => { const r = TL.resumeTimer(); r.error ? toast(r.error) : render(); };
  const pa = $('#btnPause'); if (pa) pa.onclick = () => { const r = TL.pauseTimer(); r.error ? toast(r.error) : render(); };
  const st = $('#btnStop'); if (st) st.onclick = () => {
    const r = TL.stopTimer($('#tNoteLive').value);
    if (r.error) toast(r.error); else { render(); toast('Saved ' + TL.fmtDur(r.entry.seconds) + ' to ' + projName(r.entry.projectId) + '.'); }
  };
  const nl = $('#tNoteLive'); if (nl) nl.onchange = () => TL.setTimerNote(nl.value);
  const bm = $('#btnManual');
  if (bm) bm.onclick = () => {
    const r = TL.addManualEntry({ projectId: $('#mProj').value, dateStr: $('#mDate').value,
      startHM: $('#mStart').value, endHM: $('#mEnd').value, hoursDecimal: $('#mHours').value, note: $('#mNote').value });
    if (r.error) toast(r.error); else { render(); toast('Entry added: ' + TL.fmtDur(r.entry.seconds) + '.'); }
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Delete this entry?')) return;
    TL.deleteEntry(b.getAttribute('data-del')); render(); toast('Entry deleted.');
  });
}

/* ---------------- DASHBOARD ---------------- */
function vDashboard() {
  const now = new Date();
  const today = TL.dstr(now);
  const [w0] = TL.weekRange(today);
  const sDay = TL.summarize(TL.entriesBetween(...TL.dayRange(today)));
  const sWeek = TL.summarize(TL.entriesBetween(w0, w0 + 7 * 86400000));
  const sMon = TL.summarize(TL.entriesBetween(...TL.monthRange(now.getFullYear(), now.getMonth())));
  const billPct = sMon.totalSec ? Math.round(100 * sMon.billableSec / sMon.totalSec) : 0;

  // last 7 days for bar chart
  const days = [], vals = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    const ds = TL.dstr(d);
    days.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
    vals.push(TL.summarize(TL.entriesBetween(...TL.dayRange(ds))).totalSec / 3600);
  }
  const clients = Object.values(sMon.byClient).sort((a, b) => b.sec - a.sec).slice(0, 6);
  const projs = Object.values(sMon.byProject).sort((a, b) => b.sec - a.sec).slice(0, 6);

  const projRows = projs.map(p => { const c = TL.getClient(p.clientId); return `<tr>
      <td>${clientDot(p.clientId)} <b>${esc(p.name)}</b><div class="muted small">${esc(c ? c.name : '')}</div></td>
      <td class="num">${TL.fmtHours(p.sec)}</td><td class="num">${TL.fmtMoney(p.amount)}</td>
      <td style="min-width:110px"><div class="bar"><i style="width:${sMon.totalSec ? Math.round(100 * p.sec / sMon.totalSec) : 0}%"></i></div></td></tr>`; }).join('');

  return `<div class="viewhead"><div><h1>Dashboard</h1><p>Your freelance month at a glance.</p></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat" style="--sc:#2dd4bf"><div class="k">Today</div><div class="v num">${TL.fmtHours(sDay.totalSec)}</div><div class="s num">${TL.fmtMoney(sDay.amount)} earned</div></div>
    <div class="stat" style="--sc:#a78bfa"><div class="k">This week</div><div class="v num">${TL.fmtHours(sWeek.totalSec)}</div><div class="s num">${TL.fmtMoney(sWeek.amount)} earned</div></div>
    <div class="stat" style="--sc:#fbbf24"><div class="k">This month</div><div class="v num">${TL.fmtHours(sMon.totalSec)}</div><div class="s num">${TL.fmtMoney(sMon.amount)} earned</div></div>
    <div class="stat" style="--sc:#34d399"><div class="k">Billable share</div><div class="v num">${billPct}%</div><div class="s num">${TL.fmtHours(sMon.billableSec)} of ${TL.fmtHours(sMon.totalSec)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>📈 Last 7 days <span class="tag muted small">hours</span></h3><canvas class="chart" id="chWeek"></canvas></div>
    <div class="card"><h3>🍩 This month by client</h3><canvas class="chart" id="chDonut"></canvas>
      <div class="legend">${clients.map(c => `<span><span class="dotc" style="background:${esc(c.color)}"></span>${esc(c.name)} · ${TL.fmtHours(c.sec)}</span>`).join('') || '<span class="muted">No data yet</span>'}</div></div>

function drawCharts() {

  const d = JSON.parse(el.textContent);

function setupCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = 220 * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return [ctx, r.width, 220];
}
function barChart(cv, labels, vals) {
  if (!cv) return; const [ctx, W, H] = setupCanvas(cv);
  const rr = (x, y, w, h, r) => { if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); } else { ctx.beginPath(); ctx.rect(x, y, w, h); } };
  const max = Math.max(...vals, 1), pad = 28, bw = (W - pad * 2) / vals.length;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(148,163,184,.15)'; ctx.fillStyle = '#5b6a8f'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  for (let g = 0; g <= 4; g++) { const y = 14 + (H - 52) * g / 4; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
  vals.forEach((v, i) => {
    const h = Math.max(3, (H - 56) * v / max), x = pad + i * bw + bw * 0.22, y = H - 34 - h;
    const gr = ctx.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#2dd4bf'); gr.addColorStop(1, '#818cf8');
    ctx.fillStyle = gr;
    rr(x, y, bw * 0.56, h, 5); ctx.fill();
    ctx.fillStyle = '#8b98b8'; ctx.fillText(labels[i], pad + i * bw + bw / 2, H - 14);
    if (v > 0) { ctx.fillStyle = '#e8eefb'; ctx.fillText(v.toFixed(1) + 'h', pad + i * bw + bw / 2, y - 6); }
  });
}
function donut(cv, segs) {
  if (!cv) return; const [ctx, W, H] = setupCanvas(cv);
  ctx.clearRect(0, 0, W, H);
  const total = segs.reduce((s, x) => s + x.sec, 0);
  const cx = W / 2, cy = H / 2, R = 78, r0 = 52;
  if (!total) { ctx.fillStyle = '#5b6a8f'; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('No data yet', cx, cy); return; }
  let a = -Math.PI / 2;
  segs.forEach(s => { const a2 = a + (s.sec / total) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, a, a2); ctx.arc(cx, cy, r0, a2, a, true); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill(); a = a2; });
  ctx.fillStyle = '#e8eefb'; ctx.font = '800 22px system-ui'; ctx.textAlign = 'center';
  ctx.fillText((total / 3600).toFixed(1) + 'h', cx, cy + 8);
}

let tsCursor = null;

  for (let i = 0; i < 7; i++) {

    const [a, b] = TL.dayRange(ds);
    const entries = TL.entriesBetween(a, b);

      <td style="white-space:nowrap"><b>${d.toLocaleDateString('en-US', { weekday: 'short' })}</b><div class="muted small">${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}${isToday ? ' · <span class="chip bil">today</span>' : ''}</div></td>

}

function download(name, content, type) {
  const blob = new Blob([content], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---------------- render / init ---------------- */
const VIEWS = { timer: [vTimer, bindTimer], dashboard: [vDashboard, bindDashboard], timesheet: [vTimesheet, bindTimesheet], clients: [vClients, bindClients], invoices: [vInvoices, bindInvoices], export: [vExport, bindExport] };
function bindDashboard() { drawCharts(); }
function render() {
  const r = route();
  renderNav();
  const [fn, bind] = VIEWS[r];
  $('#view').innerHTML = fn();
  bind();
  tick(true);
}
function tick(force) {
  const t = TL.state().timer;
  const st = $('#sideTimer');
  if (t) {
    const el = TL.timerElapsed(t);
    const fmt = TL.fmtHMS(el);
    st.classList.add('show');
    $('#sideTimerVal').textContent = fmt;
    $('#sideTimerName').textContent = t.paused ? 'Paused' : 'Timer running';
    $('#sideTimerProj').textContent = clientName(t.clientId) + ' · ' + projName(t.projectId);
    const big = $('#bigTimer');
    if (big && route() === 'timer') big.textContent = fmt;
  } else if (st) st.classList.remove('show');
  const tc = $('#topClock');
  if (tc) tc.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(tick, 1000);

(function init() {
  if (location.search.indexOf('demo=1') !== -1 && TL.state().entries.length === 0 && TL.state().clients.length === 0) TL.seedDemo();
  if (!location.hash) location.hash = '#/timer';
  render();
})();
</script>
</body>
</html>
