<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiEman — Shop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f3ec; color: #2b2b2b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 20px 32px; }
  .logo { width: 88px; height: 88px; border-radius: 50%; background: #1a2b4a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; margin-bottom: 16px; }

  .btn small { display: block; font-weight: 400; font-size: 13px; opacity: .75; margin-top: 4px; }

  .etsy { background: #f1641e; color: #fff; }

</head>

  <div class="logo">D</div>
